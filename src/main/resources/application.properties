spring.application.name=main-service-clean
server.port=8081
spring.datasource.url=jdbc:postgresql://postgres:5432/main_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.liquibase.change-log=classpath:/db/changelog/master.xml
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/bitlab
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/bitlab/protocol/openid-connect/certs
minio.url=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=my-bucket
keycloak.realm=bitlab
keycloak.base-url=http://localhost:8080
keycloak.client-id=main-client



